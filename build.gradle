plugins {
    id "java"
    id "idea"
    id "org.springframework.boot" version "4.0.6"
    id("io.spring.dependency-management") version "1.1.7"
    id "io.freefair.lombok" version "9.5.0"
}

group "org.abondar.experimental.shoppingcart"
version '2.0'


java {

    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

def frontendDir = file("shopping-cart")

tasks.register("npmBuild", Exec) {
    workingDir frontendDir
    commandLine "npm", "run", "build"
}

tasks.register("copyFrontend", Copy) {
    dependsOn "npmBuild"
    from "$frontendDir/dist"
    into layout.buildDirectory.dir("resources/main/static")
}

bootJar {
    dependsOn "copyFrontend"
}


dependencies {

    implementation("org.springframework.boot:spring-boot-starter-web")
    implementation("org.springframework.boot:spring-boot-starter-actuator")
    implementation("org.springframework.boot:spring-boot-starter-validation")
    implementation("org.springframework.boot:spring-boot-starter-data-redis")

    implementation("org.apache.camel.springboot:camel-spring-boot-starter:$camelVersion")
    implementation("org.apache.camel.springboot:camel-jackson3-starter:$camelVersion")
    implementation("org.apache.camel.springboot:camel-platform-http-starter:$camelVersion")
    implementation("org.apache.camel.springboot:camel-springdoc-starter:$camelVersion")
    implementation("org.apache.camel:camel-http:$camelVersion")

    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.apache.camel:camel-test-spring-junit5:$camelVersion")

    implementation("org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.0")
    implementation("org.springframework.boot:spring-boot-starter-liquibase")

    runtimeOnly("com.h2database:h2")

    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.0")
    testImplementation("org.apache.camel:camel-test-junit5")
    testImplementation("org.springframework.boot:spring-boot-starter-restclient-test")
}


tasks.named("test") {
    useJUnitPlatform()
}

bootBuildImage {
    imageName = "abondar/shoppingCart"
}

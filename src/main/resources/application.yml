spring:
  application:
    name: ShoppingCart

  main:
    banner-mode: "console"

  datasource:
    url: jdbc:h2:mem:shopping_cart;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml


mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      status:
        order: DOWN,OUT_OF_SERVICE,UP

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus



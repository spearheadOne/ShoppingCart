def frontendDir = file("shopping-cart")
def frontendBuildOutput = layout.buildDirectory.dir("frontend")
def npmExecutable = providers.environmentVariable("NPM_EXECUTABLE")
        .orElse(file("/opt/homebrew/bin/npm").exists() ? "/opt/homebrew/bin/npm" : "npm")

tasks.register("npmBuild", Exec) {
    workingDir frontendDir
    commandLine npmExecutable.get(), "run", "build"
}

tasks.register("copyFrontend", Copy) {
    dependsOn "npmBuild"
    into frontendBuildOutput.map { it.dir("static") }
    from "$frontendDir/dist"
}

bootJar {
    dependsOn "copyFrontend"
    from(frontendBuildOutput) {
        into "BOOT-INF/classes"
    }
}

bootRun {
    dependsOn "copyFrontend"
    classpath(frontendBuildOutput)
}

dependencies {
    implementation("org.apache.camel.springboot:camel-spring-redis-starter:$camelVersion")
    implementation("org.apache.camel.springboot:camel-http-starter:$camelVersion")

    testImplementation("org.springframework.boot:spring-boot-testcontainers")
    testImplementation("org.apache.camel:camel-test-junit5")

    testImplementation(platform("org.testcontainers:testcontainers-bom:2.0.2"))
    testImplementation("org.testcontainers:testcontainers-junit-jupiter")
    testImplementation("com.redis:testcontainers-redis")
    testImplementation("org.wiremock:wiremock-standalone:3.13.2")
    testImplementation("org.apache.camel:camel-test-spring-junit5")
}

bootBuildImage {
    imageName = "abondar/shopping-cart"
}

server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ProductService
  main:
    banner-mode: "console"
  datasource:
    url: jdbc:h2:mem:products;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml

camel:
  component:
    mybatis:
      sql-session-factory: sqlSessionFactory

mybatis:
  type-handlers-package: org.abondar.experimental.shoppingcart.type_handler
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      status:
        order: DOWN,OUT_OF_SERVICE,UP
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
